[package]
name = "rovai-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "multipart"] }
base64 = "0.22"
getrandom = "0.3"
if-addrs = "0.15"
memchr = "2"
rovai-core = { path = "../rovai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "net", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
